<script>
    /* ==========================================================
       1. 自行上架商品資料庫
       ========================================================== */
    const myProducts = [
      {
        id: "p1",
        title: "吉伊卡哇 chiikawa 趴姿吊飾 (正版日單/散貨)",
        badge: "熱門開團",
        badgeColor: "bg-red-50 text-red-600 border-red-200",
        priceTwd: 280,
        img: "https://images.unsplash.com/photo-1558679908-541bcf1249ff?w=500&auto=format&fit=crop&q=60",
        desc: "人氣熱銷款，預計 7-10 天海快到貨，外觀保存良好。"
      },
      {
        id: "p2",
        title: "復古 CCD 數位相機 (成色 95 新 · 已功能檢測)",
        badge: "限量 2 台",
        badgeColor: "bg-amber-50 text-amber-700 border-amber-200",
        priceTwd: 1450,
        img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500&auto=format&fit=crop&q=60",
        desc: "閒魚賣家保固、出貨前提供實拍開機錄影，附副廠電池與充電線。"
      },
      {
        id: "p3",
        title: "排球少年 / 咒術迴戰 官方限定立牌 / 徽章福袋",
        badge: "長期常態",
        badgeColor: "bg-blue-50 text-blue-700 border-blue-200",
        priceTwd: 420,
        img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop&q=60",
        desc: "日本正品中古拆擺盲抽，成色優良，滿 3 件免台灣超商運費。"
      }
    ];

    let cart = {};

    function renderProducts() {
      const container = document.getElementById('productGrid');
      container.innerHTML = myProducts.map(p => `
        <div class="bg-white rounded-2xl overflow-hidden border border-slate-200/80 hover:shadow-md transition duration-200 flex flex-col justify-between p-4">
          <div>
            <div class="relative w-full h-44 bg-slate-100 rounded-xl overflow-hidden mb-3">
              <img src="${p.img}" alt="${p.title}" class="w-full h-full object-cover" loading="lazy" />
              <span class="absolute top-2.5 left-2.5 text-[11px] font-bold px-2 py-0.5 rounded-md border ${p.badgeColor}">
                ${p.badge}
              </span>
            </div>
            <h4 class="font-bold text-sm text-slate-900 leading-snug line-clamp-2">${p.title}</h4>
            <p class="text-xs text-slate-500 mt-1.5 line-clamp-2 leading-relaxed">${p.desc}</p>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
            <div>
              <span class="text-[11px] text-slate-400 block">代購優惠價</span>
              <span class="text-base font-extrabold text-amber-600">NT$ ${p.priceTwd.toLocaleString()}</span>
            </div>
            <button type="button" onclick="addToCart('${p.id}')" class="text-xs font-bold bg-slate-900 hover:bg-amber-500 active:scale-95 text-white px-3.5 py-2 rounded-xl transition duration-150 flex items-center gap-1">
              <span>＋</span> 加入委託
            </button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      cart[productId] = (cart[productId] || 0) + 1;
      updateCartDisplay();
      document.getElementById('order-form').scrollIntoView({ behavior: 'smooth' });
    }

    function changeQty(productId, delta) {
      if (!cart[productId]) return;
      cart[productId] += delta;
      if (cart[productId] <= 0) delete cart[productId];
      updateCartDisplay();
    }

    function clearCart() {
      cart = {};
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const section = document.getElementById('selectedCartSection');
      const list = document.getElementById('cartItemsList');
      const subtotalEl = document.getElementById('cartSubtotal');
      const summaryInput = document.getElementById('cartSummary');

      const itemIds = Object.keys(cart);
      if (itemIds.length === 0) {
        section.classList.add('hidden');
        summaryInput.value = "";
        return;
      }

      section.classList.remove('hidden');
      let subtotal = 0;
      let summaryTextList = [];

      list.innerHTML = itemIds.map(id => {
        const item = myProducts.find(p => p.id === id);
        const qty = cart[id];
        const lineTotal = item.priceTwd * qty;
        subtotal += lineTotal;
        summaryTextList.push(`${item.title} x${qty} (小計NT$${lineTotal})`);

        return `
          <div class="flex justify-between items-center bg-white p-2.5 rounded-lg border border-slate-200 text-xs">
            <div class="pr-2 truncate">
              <span class="font-bold text-slate-800">${item.title}</span>
              <span class="text-slate-400 block text-[11px]">單價 NT$ ${item.priceTwd}</span>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
                <button type="button" onclick="changeQty('${id}', -1)" class="px-2 py-0.5 hover:bg-slate-200 text-slate-600">-</button>
                <span class="px-2 font-bold text-slate-800">${qty}</span>
                <button type="button" onclick="changeQty('${id}', 1)" class="px-2 py-0.5 hover:bg-slate-200 text-slate-600">+</button>
              </div>
              <span class="font-bold text-amber-600 min-w-[65px] text-right">NT$ ${lineTotal.toLocaleString()}</span>
            </div>
          </div>
        `;
      }).join('');

      subtotalEl.textContent = subtotal.toLocaleString();
      summaryInput.value = summaryTextList.join('； ') + ` 【開團商品總計: NT$${subtotal}】`;
    }

    /* ==========================================================
       2. 閒魚自選試算器邏輯
       ========================================================== */
    const rmbInput = document.getElementById('rmbPrice');
    const weightInput = document.getElementById('weightKg');
    const itemTwdEl = document.getElementById('itemTwd');
    const feeTwdEl = document.getElementById('feeTwd');
    const shippingTwdEl = document.getElementById('shippingTwd');
    const grandTotalEl = document.getElementById('grandTotal');

    function calculate() {
      const rmb = parseFloat(rmbInput.value) || 0;
      const weight = parseFloat(weightInput.value) || 0;

      if (rmb === 0) {
        itemTwdEl.textContent = '0';
        feeTwdEl.textContent = '0';
        shippingTwdEl.textContent = '0';
        grandTotalEl.textContent = '0';
        return;
      }

      let baseRate = 4.8 * 1.03 * 1.01;
      if (rmb > 200) baseRate = baseRate * 1.03;

      const itemTwd = Math.round(rmb * baseRate);
      let fee = Math.round(itemTwd * 0.035);
      if (fee < 30) fee = 30;

      const chargedWeight = weight > 0 ? Math.max(1, Math.ceil(weight)) : 0;
      const shippingTwd = chargedWeight * 70;
      const grandTotal = itemTwd + fee + shippingTwd;

      itemTwdEl.textContent = itemTwd.toLocaleString();
      feeTwdEl.textContent = fee.toLocaleString();
      shippingTwdEl.textContent = shippingTwd.toLocaleString();
      grandTotalEl.textContent = grandTotal.toLocaleString();
    }

    rmbInput.addEventListener('input', calculate);
    weightInput.addEventListener('input', calculate);

    /* ==========================================================
       3. 表單送出與 Google Sheets 串接 (包含價格欄位)
       ========================================================== */
    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusAlert = document.getElementById('statusAlert');

    const SUBMIT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzFyGNgrHs-9mM1Cm-EAVvxn4-sG147Mdh8Mhh_L7AwxwAFJ8rzzKR9m_ZLF_VkrTVE/exec";

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const custName = document.getElementById('custName').value.trim();
      const custContact = document.getElementById('custContact').value.trim();
      const customUrls = document.getElementById('customUrls').value.trim();
      const cartSummary = document.getElementById('cartSummary').value.trim();

      if (!cartSummary && !customUrls) {
        alert('請至少選購一項「開團商品」或填寫「商品連結/淘口令」！');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '正在為您記錄委託需求...';
      submitBtn.classList.add('opacity-60');

      // 取得開團商品金額數值
      const cartSubtotalEl = document.getElementById('cartSubtotal');
      const cartSubtotalText = cartSubtotalEl ? cartSubtotalEl.textContent.replace(/,/g, '') : "0";
      const totalAmount = parseInt(cartSubtotalText, 10) || 0;

      const payload = {
        timestamp: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
        name: custName,
        contact: custContact,
        selectedProducts: cartSummary || '無選購開團商品',
        customUrls: customUrls || '無額外自選網址',
        spec: document.getElementById('itemSpec').value.trim() || '無特別指定',
        budget: document.getElementById('itemBudget').value.trim() || '無特別限制',
        totalAmount: totalAmount > 0 ? `NT$ ${totalAmount.toLocaleString()}` : '自選品待報價'
      };

      try {
        await fetch(SUBMIT_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusAlert.className = "p-4 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 block";
        statusAlert.innerHTML = '🎉 委託已成功送出！資料已自動記錄至後台試算表，我會儘速與您確認明細！';
        form.reset();
        clearCart();
        submitBtn.disabled = false;
        submitBtn.textContent = '已送出成功';
        submitBtn.classList.remove('opacity-60');
      } catch (err) {
        statusAlert.className = "p-4 rounded-xl text-xs font-semibold bg-red-50 text-red-800 border border-red-200 block";
        statusAlert.innerHTML = '❌ 傳送時發生錯誤，請稍後再試。';
        submitBtn.disabled = false;
        submitBtn.textContent = '重新送出';
        submitBtn.classList.remove('opacity-60');
      }
    });

    renderProducts();
  </script>
